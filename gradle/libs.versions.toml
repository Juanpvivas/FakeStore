[versions]
agp = "8.3.2"
kotlin = "1.9.0"
material3Android = "1.3.1"
hilt = "2.51.1"
hiltCompiler = "2.51.1"
retrofit = "2.9.0"
gson = "2.9.0"
coroutines = "1.6.0"
ui = "1.4.0"
material = "1.4.0"
preview = "1.4.0"
activity = "1.6.1"
hiltNavigation = "1.0.0"

[libraries]
androidx-material3-android = { group = "androidx.compose.material3", name = "material3-android", version.ref = "material3Android" }
dagger-hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt"}
dagger-hiltcompiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hiltCompiler"}
squareup-retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit"}
squareup-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "gson"}
jetbrains-kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui"}
androidx-compose-material = { group = "androidx.compose.material", name = "material", version.ref = "material"}
androidx-compose-ui-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "preview"}
androidx-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity"}
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation"}

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

